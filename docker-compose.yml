services:
  db:
    image: postgres:15-alpine
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: onecp_db
      POSTGRES_USER: onecp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onecp -d onecp_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://onecp:${DB_PASSWORD}@db:5432/onecp_db
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMSRU_API_KEY: ${SMSRU_API_KEY:-}
    volumes:
      - /onecp/uploads:/onecp/uploads
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
