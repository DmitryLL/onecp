name: Deploy to server

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 192.124.171.167 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@192.124.171.167 '
            cd /onecp &&
            git fetch origin deploy &&
            git reset --hard origin/deploy &&

            if ! command -v nginx &>/dev/null; then
              apt-get update && apt-get install -y nginx
            fi

            cat > /etc/nginx/sites-available/onecp <<NGINX
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /onecp;
    index index.html;

    location / {
        try_files \$uri \$uri/ =404;
    }
}
NGINX

            ln -sf /etc/nginx/sites-available/onecp /etc/nginx/sites-enabled/onecp
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx || systemctl start nginx
          '
