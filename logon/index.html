<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — OneCp Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            margin: 20px;
        }
        .login-card h1 {
            color: #fff;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-card .subtitle {
            color: #888;
            text-align: center;
            font-size: .95rem;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #aaa;
            font-size: .85rem;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1.5px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color .2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #f5efe6;
        }
        .form-group input::placeholder { color: #555; }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #f5efe6;
            color: #111;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s, transform .1s;
            margin-top: 8px;
        }
        .btn-login:hover { background: #e8ddd0; }
        .btn-login:active { transform: scale(.98); }
        .error-msg {
            color: #e74c3c;
            font-size: .9rem;
            text-align: center;
            margin-top: 16px;
            display: none;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: .9rem;
        }
        .back-link:hover { color: #aaa; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>OneCp</h1>
        <p class="subtitle">Вход в панель управления</p>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" placeholder="admin" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login">Войти</button>
        </form>
        <p class="error-msg" id="errorMsg">Неверный логин или пароль</p>
        <a href="/" class="back-link">← На главную</a>
    </div>

    <script>
        if (localStorage.getItem('onecp_admin_token')) {
            window.location.href = '/admin/';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error');
                localStorage.setItem('onecp_admin_token', data.token);
                window.location.href = '/admin/';
            } catch (err) {
                const el = document.getElementById('errorMsg');
                el.textContent = err.message;
                el.style.display = 'block';
                setTimeout(() => el.style.display = 'none', 3000);
            }
        }
    </script>
</body>
</html>
